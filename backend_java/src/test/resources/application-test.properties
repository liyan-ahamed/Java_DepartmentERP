# Integration tests: the datasource URL and a random JWT secret are supplied by IntegrationTestBase.
spring.flyway.locations=classpath:db/migration,classpath:db/dev
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.show-sql=false

# Tests invoke the poll reminder job directly; keep the scheduled run out of the way.
app.poll-reminder.initial-delay-ms=86400000

app.leetcode.second-year-roster=

# Holiday tests call the sync themselves (with a mocked source); no startup or scheduled sync.
holidays.sync.enabled=false

# =============================================
# DEV Profile Overrides
# =============================================

# Show SQL for debugging
spring.jpa.show-sql=true

# DataSeeder creates the demo login accounts (hod@ / staff@ / one student) in this profile only.

# Demo department data (batches, sections, ~574 students, extra staff) lives in db/dev
# and is only applied in dev/test. Production uses db/migration only (schema + reference data).
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Gradebook / Score (assessments, grades, internal marks) is ON for local development.
# The flag stays: FEATURES_GRADEBOOK_ENABLED=false switches the marking APIs off again.
features.gradebook.enabled=${FEATURES_GRADEBOOK_ENABLED:true}

# Some populated local databases reached later schema versions without a V10
# history entry. With the demo seed in the dev location, Flyway therefore
# classifies V10 as ignored (out of order). Do not run it now: V10 truncates the
# academic roster. Accept ignored migrations in dev; checksum validation and
# forward migrations remain enabled. Inspect any other ignored version before
# accepting it; Flyway's ignore patterns cannot select a single version.
spring.flyway.ignore-migration-patterns=*:missing,*:ignored

# Local validation failures must never trigger a database wipe.
spring.flyway.clean-on-validation-error=false
spring.flyway.clean-disabled=true

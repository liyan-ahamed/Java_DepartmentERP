# ERP Backend Application Properties
# ====================================

# Application
spring.application.name=erp-backend

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ---- PostgreSQL Database ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erp_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=ErpHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Schema and reference data only. Demo data (db/dev) is added by the dev profile.
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.ignore-migration-patterns=*:missing
# Never wipe the database automatically. A changed historical migration must fail
# startup so it can be fixed with a new migration instead.
spring.flyway.clean-disabled=true

# ---- JWT ----
# Required. No default: startup fails unless JWT_SECRET is set to at least 64 random bytes (HS512).
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.security.jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRATION:604800000}
app.security.jwt.issuer=${JWT_ISSUER:erp-backend}

# ---- CORS ----
app.cors.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ---- LeetCode ----
# All LeetCode requests are made server-side, one profile per request.
app.leetcode.graphql-url=${LEETCODE_GRAPHQL_URL:https://leetcode.com/graphql}
app.leetcode.timeout-ms=${LEETCODE_TIMEOUT_MS:10000}
app.leetcode.concurrency=${LEETCODE_CONCURRENCY:5}
app.leetcode.max-profiles-per-request=${LEETCODE_MAX_PROFILES_PER_REQUEST:80}
# Optional Second-Year roster CSV (name,leetcode_url) applied on startup, e.g. file:C:/data/second-year.csv
app.leetcode.second-year-roster=${LEETCODE_SECOND_YEAR_ROSTER:}

# ---- Springdoc / Swagger ----
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ---- Logging ----
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---- Feature flags ----
# Gradebook / internal-marks marking APIs (/assessments, /grades, /internal-marks).
# Off by default here; switched ON in the dev profile (application-dev.properties).
# FEATURES_GRADEBOOK_ENABLED=true/false overrides both.
features.gradebook.enabled=${FEATURES_GRADEBOOK_ENABLED:false}
# Lesson Plans (/lesson-plans + its dev seeding) are not an active product feature: off in every profile.
# Code and data are kept; FEATURES_LESSON_PLANS_ENABLED=true switches the feature back on.
features.lesson-plans.enabled=${FEATURES_LESSON_PLANS_ENABLED:false}
# Portfolio Analytics (GET /portfolio/summary) is off in every profile; student portfolios and the review
# queue are not affected. FEATURES_PORTFOLIO_ANALYTICS_ENABLED=true switches it back on.
features.portfolio-analytics.enabled=${FEATURES_PORTFOLIO_ANALYTICS_ENABLED:false}

# ---- Attendance ----
# Minimum attendance percentage per subject; students below it are flagged (and notified at most
# once per subject per cooldown period when a session is finalized).
attendance.minimum-percentage=${ATTENDANCE_MINIMUM_PERCENTAGE:75}
attendance.shortage-notification-cooldown-days=${ATTENDANCE_SHORTAGE_COOLDOWN_DAYS:7}

# ---- Staff dashboard ----
# Upcoming classes look this many days ahead (no term dates are stored yet). A marks-entry task is DUE_SOON
# when its deadline is within this many hours, OVERDUE after it.
dashboard.staff.upcoming-days=${DASHBOARD_STAFF_UPCOMING_DAYS:14}
dashboard.staff.marks-entry-due-soon-hours=${DASHBOARD_MARKS_DUE_SOON_HOURS:48}

# ---- Holidays ----
# India (central government) + Tamil Nadu holidays are cached in the holidays table and synced from
# the official dataset files (<dataset-location><year>.json) at startup and on the cron below, for the
# current and next calendar year. Pages read only the cache.
holidays.dataset-location=${HOLIDAYS_DATASET_LOCATION:classpath:holidays/}
# The college's own calendar (<location><year>.json). A year that has one uses only that calendar.
holidays.college-calendar-location=${HOLIDAYS_COLLEGE_CALENDAR_LOCATION:classpath:holidays/college/}
holidays.sync.enabled=${HOLIDAYS_SYNC_ENABLED:true}
holidays.sync.cron=${HOLIDAYS_SYNC_CRON:0 0 3 * * MON}
